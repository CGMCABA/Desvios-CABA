<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Desvios_Nunciatura recortada</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
  :root {
    --fucsia: #005C59;
    --rojo: #3949AB;
    --panel-w: 320px;
    --report-h: 240px;
  }
  html, body { height: 100%; margin: 0; padding: 0; }

  #app {
    position: absolute; inset: 0;
    display: flex;
 height: 100vh;
 max-height: 100vh;
 height: -webkit-fill-available;
    background: #e5e5e5;
    font-family: system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-size: 14px;
  }

  /* Panel izquierdo (capas) */
  #leftpanel {
 position: relative;
    width: var(--panel-w);
    background: #fff;
    border-right: 4px solid var(--fucsia);
    padding: 10px 12px;
    overflow-y: auto;
 overflow-x: visible;
    box-sizing: border-box;
    transition: width .25s ease, padding .25s ease, border-right-color .25s ease;
  }
  #leftpanel.hidden {
    width: 0;
    padding: 0;
    border-right-color: transparent;
    overflow: hidden;
  }

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
 min-height: 0;
    position: relative;
  }

  #map {
    flex: 1;
    min-height: 200px;
    background: #e5e5e5;
  }

  /* Botón único para mostrar/ocultar capas */
  #btnLayers {
    position: absolute;
    z-index: 9999;
    top: 10px;
    left: 10px;
 background-color: #005C59;
 background: var(--fucsia, #005C59);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 8px 10px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  
 opacity: 1;
}

  /* Drag bar + reporte */
  #dragbar {
    height: 10px;
    cursor: row-resize;
    background: linear-gradient(90deg, transparent, rgba(57,73,171,.35), transparent);
    border-top: 1px solid rgba(0,0,0,.08);
    border-bottom: 1px solid rgba(0,0,0,.08);
    user-select: none;
    touch-action: none;
  }

  #bottompanel {
    height: var(--report-h);
    background: #fff;
    border-top: 4px solid var(--rojo);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    transition: height .25s ease;
  }

  #bottombar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid #ddd;
    user-select: none;
  }

  #toggleReport {
 background-color: #3949AB;
 background: var(--rojo, #3949AB);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    font-weight: 800;
  
 opacity: 1;
}

  #btnCopyReport {
    background: #111;
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    font-weight: 800;
    transition: background .18s ease;
  }
  #btnCopyReport.copied {
    background: #16a34a;
    animation: btnCopiedPulse .32s ease;
  }
  @keyframes btnCopiedPulse { 40% { transform: scale(1.09); } }

  #reporte-html {
    padding: 10px 12px;
    overflow-y: auto;
  }

  #bottompanel.collapsed { height: 38px; }
  #bottompanel.collapsed #reporte-html { display: none; }
  #bottompanel.collapsed + #dragbar { display: none; }

  .muted { color: #666; }

  .group {
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    padding: 8px;
    margin: 8px 0;
  }
  .group-title {
    font-weight: 900;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    user-select:none;
  }
  .group-children { margin-top: 8px; padding-left: 6px; }
  .group.collapsed .group-children { display: none; }

  /* Flechas como marker rotado */
  .arrow-end-icon { background: transparent !important; border: 0 !important; }
  .arrow-end { pointer-events: none; line-height:0; margin:0; padding:0; }
  .arrow-end svg { display:block; }
  .base-map-light { filter: saturate(.42) brightness(1.13) contrast(.88); }

  /* Resaltado permanente: paradas asociadas al desvío seleccionado en el panel */
  .stop-p-icon > span { transition: transform .15s ease; }
  .stop-p-icon.stop-assoc-hl > span { box-shadow: 0 0 0 2px #ff1f1f, 0 0 0 4px #fff; }
  .stop-p-icon.stop-shrunk > span { transform: scale(.5); }
  .group-children label.sel-label { cursor: pointer; }
  .group-children label.sel-label:hover { text-decoration: underline; }
  .group-children label.sel-label.is-selected { color: #d61f1f; font-weight: 800; }

  /* Filtro por número de línea del panel de capas */
  #lineFilter { width: 100%; box-sizing: border-box; margin: 2px 0 4px; padding: 7px 10px; border: 1px solid #c9d2dc; border-radius: 7px; font: inherit; outline: 0; }
  #lineFilter:focus { border-color: var(--fucsia); }
  .group-children div.filtro-oculto, .group-children div.modo-oculto { display: none !important; }

  /* Modo de listado: por desvío (agrupado) o por línea */
  .modo-fila { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; color: #555; font-size: 13px; }
  .modo-listado { display: inline-flex; border: 1px solid #c9d2dc; border-radius: 7px; overflow: hidden; flex: none; }
  .modo-listado button { border: 0; background: #fff; color: #334155; padding: 5px 9px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 700; }
  .modo-listado button.activo { background: var(--fucsia); color: #fff; }
  .group-children .sin-coincidencias { color: #666; font-size: 12px; margin: 6px 0; }

  
/* Barra vertical en degradé al borde del panel de capas (solo cuando está visible) */
#leftpanel::after {
 content: '';
 position: absolute;
 top: 0;
 right: -10px;
 width: 10px;
 height: 100%;
 background: linear-gradient(180deg, transparent, rgba(0,92,89,.35), transparent);
 border-left: 1px solid rgba(0,0,0,.08);
 border-right: 1px solid rgba(0,0,0,.08);
 pointer-events: none;
}
#leftpanel.hidden::after { display: none; }

/* iOS Safari: usar dynamic viewport height cuando está disponible */
@supports (height: 100dvh) {
  #app { height: 100dvh; max-height: 100dvh; }
}
</style>
</head>
<body>
  <div id="app">
    <div id="leftpanel" class="hidden">
      <h2>Capas y elementos</h2>
      <div class="modo-fila">Listado <span class="modo-listado"></span></div>
      <input id="lineFilter" type="search" autocomplete="off" placeholder="Filtrar por número de línea…"/>
      <div id="checklist"></div>
      <hr/>
      <h3>Mapa base</h3>
      <div id="basemap"></div>
    </div>

    <div id="main">
      <button id="btnLayers" type="button">Mostrar capas</button>
      <div id="map"></div>
      <div id="dragbar" title="Arrastrá para cambiar la altura del reporte"></div>
      <div id="bottompanel" class="collapsed">
        <div id="bottombar">
          <div><strong>Reporte</strong> <span class="muted">– 01/11 - 18:38</span></div>
          <div style="display:flex; gap:8px; align-items:center;">
            <span class="modo-listado"></span>
            <button id="btnCopyReport" type="button">Copiar</button>
            <button id="toggleReport" type="button">Mostrar reporte</button>
          </div>
        </div>
        <div id="reporte-html"></div>
      </div>
    </div>
  </div>

    arrowsCacheByLS[ls] = [];
    const fc = { type: 'FeatureCollection', features: desviosByLS[ls] };
    const lyr = L.geoJSON(fc, {
      style: () => Object.assign({ color: colorFor(ls) }, dvZoomStyle()),
      bubblingMouseEvents: false,
      onEachFeature: (f, l) => {
        l.bindPopup(popupDesvio((f && f.properties) ? f.properties : {}));
        l.on('click', () => selectDesvioGroup(_groupKeyForLs(ls), false));
        try {
          let latlngs = l.getLatLngs();
          if (Array.isArray(latlngs) && latlngs.length && Array.isArray(latlngs[0])) latlngs = latlngs[latlngs.length - 1];
          if (latlngs && latlngs.length >= 2) {
            const b = latlngs[latlngs.length - 1];
            // Puede haber varios vértices finales duplicados. Buscar hacia
            // atrás el último segmento de longitud real evita ángulos cero
            // y flechas que parecen separadas o giradas respecto de la línea.
            let a = null;
            for (let i = latlngs.length - 2; i >= 0; i--) {
              if (map.distance(latlngs[i], b) > 0.05) { a = latlngs[i]; break; }
            }
            if (a) arrowsCacheByLS[ls].push({ latlng: b, angleDeg: angleDegEnd(a, b) });
          }
        } catch(e) {}
      }
    });
    layerByLS[ls] = lyr;
    grpDesviosAll.addLayer(lyr);
    boundLayers.push(lyr);
  });

  // ---- Claves de "línea afectada" (linea|recorrido|sentido) para sincronizar
  //      desvíos <-> paradas <-> reporte y para el resaltado permanente. ----
  function _normAff(v) {
    const t = String(v == null ? '' : v).trim().toUpperCase();
    return /^[0-9]+$/.test(t) ? String(parseInt(t, 10)) : t;
  }
  function _affKey(linea, recorrido, sentido) {
    return _normAff(linea) + '|' + _normAff(recorrido) + '|' + _normAff(sentido);
  }
  function _lsAffKeys(ls) {
    const parts = String(ls || '').split(' - ').map(x => x.trim()).filter(Boolean);
    if (parts.length >= 3) return [_affKey(parts[0], parts.slice(1, -1).join(' - '), parts[parts.length - 1])];
    if (parts.length === 2) return [_affKey(parts[0], '', parts[1])];
    return parts.length ? [_affKey(parts[0], '', '')] : [];
  }
  // Como _lsAffKeys, pero abre los ramales compactados: "064 - A/B - VUELTA"
  // da las claves de A y de B (las etiquetas del reporte editado o combinado).
  function _partAffKeys(label) {
    const p = String(label || '').split(' - ').map(x => x.trim()).filter(Boolean);
    if (p.length < 3) return _lsAffKeys(label);
    return p.slice(1, -1).join(' - ').split('/').map(r => _affKey(p[0], r, p[p.length - 1]));
  }
  // Paradas físicas distintas: varias líneas en el mismo punto cuentan 1 sola vez.
  function _distinctStopPoints(fc) {
    const seen = {};
    ((fc && fc.features) || []).forEach((f, i) => {
      const p = f.properties || {};
      const d = String(p.dir || '').trim().toLowerCase();
      if (d && d !== 'sin dirección' && d !== 'sin direccion') { seen['d:' + d] = 1; return; }
      const c = (f.geometry || {}).coordinates || [];
      seen[c.length >= 2 ? ('c:' + (+c[1]).toFixed(5) + ',' + (+c[0]).toFixed(5)) : ('x:' + (p.id != null ? p.id : i))] = 1;
    });
    return Object.keys(seen).length;
  }

  // Paradas anuladas: agrupamos por línea/sentido y fusionamos ramales que
  // comparten exactamente la misma secuencia de direcciones (igual criterio
  // que el reporte de paradas anuladas).
  function stopIcon(color) {
    return L.divIcon({
      className: 'stop-p-icon', iconSize: [20, 20], iconAnchor: [10, 10], popupAnchor: [0, -10],
      html: '<span style="display:flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:50%;background:' + color + ';color:#fff;font:bold 12px/1 Arial,sans-serif">P</span>'
    });
  }
  function popupParada(p) {
    const ls = (p && p.linea_sentido) ? p.linea_sentido : 'Parada anulada';
    const dir = (p && p.dir) ? p.dir : 'Sin dirección';
    return '<div><b>Parada anulada</b></div><div>' + ls + '</div><div class="muted">' + dir + '</div>';
  }
  const paradasByKey = {};
  const enabledPa = {};
  (function() {
    const rawGroups = {};
    (PARADAS.features || []).forEach(f => {
      const key = String((f.properties || {}).linea_sentido || 'Línea sin identificar');
      (rawGroups[key] = rawGroups[key] || []).push(f);
    });
    const merged = {};
    Object.keys(rawGroups).sort().forEach(label => {
      const items = rawGroups[label];
      const addresses = items.map(f => String((f.properties || {}).dir || 'Sin dirección')).join('§');
      const p0 = items[0].properties || {};
      const linea = p0.linea, sentido = p0.sentido, recorrido = p0.recorrido;
      const hasLineaSentido = linea !== undefined && linea !== null && linea !== '' && sentido !== undefined && sentido !== null && sentido !== '';
      const mergeKey = hasLineaSentido ? (linea + '||' + sentido + '||' + addresses) : ('__raw__||' + label);
      if (!merged[mergeKey]) merged[mergeKey] = { recorridos: [], rawLabels: [], features: [], linea, sentido, label };
      const entry = merged[mergeKey];
      if (recorrido !== undefined && recorrido !== null && recorrido !== '' && entry.recorridos.indexOf(String(recorrido)) < 0) entry.recorridos.push(String(recorrido));
      entry.rawLabels.push(label);
      entry.features.push.apply(entry.features, items);
    });
    Object.keys(merged).sort((a, b) => {
      const ea = merged[a], eb = merged[b];
      const ka = (ea.linea || '') + '|' + (ea.sentido || '') + '|' + ea.recorridos.join('/');
      const kb = (eb.linea || '') + '|' + (eb.sentido || '') + '|' + eb.recorridos.join('/');
      return ka.localeCompare(kb, 'es', { numeric: true });
    }).forEach(mergeKey => {
      const entry = merged[mergeKey];
      const displayLabel = entry.recorridos.length
        ? (entry.linea + ' - ' + entry.recorridos.slice().sort((a, b) => a.localeCompare(b, 'es', { numeric: true })).join('/') + ' - ' + entry.sentido)
        : entry.label;
      const holder = L.geoJSON({ type: 'FeatureCollection', features: entry.features }, {
        pointToLayer: (f, latlng) => L.marker(latlng, { icon: stopIcon('#dc2626') }),
        onEachFeature: (f, l) => l.bindPopup(popupParada((f && f.properties) ? f.properties : {}))
      });
      grpParadasAll.addLayer(holder);
      enabledPa[mergeKey] = true;
      const _ak = {};
      entry.features.forEach(f => {
        const p = f.properties || {};
        _ak[_affKey(p.linea, p.recorrido, p.sentido)] = true;
      });
      paradasByKey[mergeKey] = { holder, displayLabel, rawLabels: entry.rawLabels, count: _distinctStopPoints({ features: entry.features }), affKeys: Object.keys(_ak) };
    });
  })();

  // Puente entre el panel de capas (scope de su IIFE) y la sincronización /
  // resaltado que se arma más abajo.
  const _syncBridge = { dvGroupCbs: {}, paGroupCbs: {}, dvGroups: {}, dvMaster: null, paMaster: null, refresh: function() {} };

  // ---- Resaltado permanente: click en el TEXTO de un desvío del panel ----
  let _selDvKey = null;
  // Encuadre activo tras clickear un desvío (o "Todos"): se reaplica al
  // maximizar/minimizar el reporte para que la geometría siga llenando la
  // ventana visible del mapa.
  let _focusBounds = null;
  // Parada puntual resaltada (una sola por vez, como el desvío): clickear
  // otra parada asociada al mismo desvío la reemplaza (se despinta la
  // anterior); clickear la misma deselecciona todo.
  let _selStopKey = null;
  function _clearStopAssocHL() {
    document.querySelectorAll('.stop-p-icon.stop-assoc-hl, .stop-p-icon.stop-shrunk').forEach(el => {
      el.classList.remove('stop-assoc-hl');
      el.classList.remove('stop-shrunk');
    });
    Object.keys(paradasByKey).forEach(mk => {
      (paradasByKey[mk].holder.getLayers() || []).forEach(ly => { if (ly.setZIndexOffset) ly.setZIndexOffset(0); });
    });
  }
  // Identidad de parada física: dos features de líneas distintas en la misma
  // parada comparten dirección (o coordenada si no hay dirección).
  function _stopIdentity(props, latlng) {
    const d = String((props && props.dir) || '').trim().toLowerCase();
    if (d && d !== 'sin dirección' && d !== 'sin direccion') return 'd:' + d;
    if (latlng) return 'c:' + latlng.lat.toFixed(5) + ',' + latlng.lng.toFixed(5);
    return 'x:' + ((props && props.id) || '');
  }
  function _dvGroupAffKeys(key) {
    const g = _syncBridge.dvGroups[key];
    if (!g) return [];
    const set = {};
    g.members.forEach(ls => _lsAffKeys(ls).forEach(k => set[k] = true));
    return Object.keys(set);
  }
  function _restyleDvGroup(key, selected) {
    const g = _syncBridge.dvGroups[key];
    if (!g) return;
    g.members.forEach(ls => {
      const lyr = layerByLS[ls];
      if (!lyr) return;
      if (selected) {
        // Rojo + 25% de grosor (adaptado al zoom; sin extra en zoom out lejano).
        const _zs = dvZoomStyle();
        lyr.setStyle(Object.assign({}, _zs, { color: '#ff0000', weight: selWeight(_zs.weight) }));
        if (lyr.bringToFront) lyr.bringToFront();
      } else {
        lyr.setStyle(Object.assign({ color: colorFor(ls) }, dvZoomStyle()));
      }
    });
    rebuildArrows();
  }
  function _isSelectedLs(ls) {
    if (_selDvKey == null) return false;
    const g = _syncBridge.dvGroups[_selDvKey];
    return !!(g && g.members.indexOf(ls) >= 0);
  }
  // Clave de grupo (linea||sentido) que contiene un linea_sentido crudo: permite
  // que el click en la geometría del mapa dispare el mismo resaltado que el panel.
  function _groupKeyForLs(ls) {
    const groups = _syncBridge.dvGroups;
    for (const gk in groups) {
      if ((groups[gk].members || []).indexOf(ls) >= 0) return gk;
    }
    return null;
  }
  function clearDesvioSelection() {
    if (_selDvKey == null) return;
    const prev = _selDvKey;
    _selDvKey = null;
    _selStopKey = null;
    _focusBounds = null;
    _restyleDvGroup(prev, false);
    _clearStopAssocHL();
    document.querySelectorAll('#checklist label.sel-label.is-selected').forEach(el => el.classList.remove('is-selected'));
  }
  // Resalta en el mapa (borde rojo / reducidas) las paradas asociadas al
  // desvío `key`. El título del panel se marca en rojo según `cascadeStops`:
  // true (clic en el propio desvío) -> TODAS las paradas asociadas a sus
  // líneas; false (clic en una parada puntual) -> solo el título de
  // _selStopKey (la parada clickeada a mano). Reutilizable sin pasar por el
  // toggle de selectDesvioGroup, para que clickear una segunda parada del
  // mismo desvío no lo deseleccione.
  function _applyStopHighlightForDvGroup(key, cascadeStops) {
    const want = {};
    _dvGroupAffKeys(key).forEach(k => want[k] = true);
    // Paso 1: identidades de las paradas asociadas al desvío seleccionado.
    const assocIds = {};
    Object.keys(paradasByKey).forEach(mk => {
      const entry = paradasByKey[mk];
      if (!(entry.affKeys || []).some(k => want[k])) return;
      (entry.holder.getLayers() || []).forEach(ly => {
        assocIds[_stopIdentity((ly.feature && ly.feature.properties) || {}, ly.getLatLng && ly.getLatLng())] = true;
      });
    });
    // Paso 2: asociada (por línea o por parada física compartida) -> borde rojo;
    // el resto -> 50%. El título del panel solo se pinta si fue clickeado.
    Object.keys(paradasByKey).forEach(mk => {
      const entry = paradasByKey[mk];
      const direct = (entry.affKeys || []).some(k => want[k]);
      if (entry.labelEl) entry.labelEl.classList.toggle('is-selected', mk === _selStopKey || (cascadeStops && direct));
      (entry.holder.getLayers() || []).forEach(ly => {
        if (!ly._icon) return;
        const shared = !!assocIds[_stopIdentity((ly.feature && ly.feature.properties) || {}, ly.getLatLng && ly.getLatLng())];
        const assoc = direct || shared;
        ly._icon.classList.add(assoc ? 'stop-assoc-hl' : 'stop-shrunk');
        if (ly.setZIndexOffset) ly.setZIndexOffset(assoc ? 0 : -100000);
      });
    });
  }
  // abrirTarjeta: desde el panel se abre la tarjeta del desvío en el medio de
  // su recorrido; el clic en el mapa no la pide porque ya abre la suya ahí.
  function selectDesvioGroup(key, abrirTarjeta) {
    const tarjeta = abrirTarjeta !== false;
    if (key == null) { clearDesvioSelection(); return; }
    if (_selDvKey === key) { clearDesvioSelection(); if (tarjeta) map.closePopup(); return; }
    clearDesvioSelection();
    _selDvKey = key;
    _restyleDvGroup(key, true);
    _applyStopHighlightForDvGroup(key, true);
    const g = _syncBridge.dvGroups[key];
    const cb = _syncBridge.dvGroupCbs[key];
    if (g && cb) {
      const row = cb.closest('div');
      const lab = row && row.querySelector('label.sel-label');
      if (lab) lab.classList.add('is-selected');
    }
    try {
      const lyrs = ((g && g.members) || []).map(ls => layerByLS[ls]).filter(Boolean);
      if (lyrs.length) {
        const b = L.featureGroup(lyrs).getBounds();
        if (b && b.isValid()) _fitFocus(b);
      }
      if (tarjeta) {
        // El tramo con más vértices del grupo; la tarjeta va en su vértice del medio.
        let mejor = null, puntos = [];
        lyrs.forEach(lyr => lyr.eachLayer(sub => {
          const pts = L.LineUtil.isFlat(sub.getLatLngs()) ? sub.getLatLngs() : [].concat.apply([], sub.getLatLngs());
          if (pts.length > puntos.length) { mejor = sub; puntos = pts; }
        }));
        if (mejor && puntos.length) {
          L.popup().setLatLng(puntos[Math.floor(puntos.length / 2)])
            .setContent(popupDesvio((mejor.feature && mejor.feature.properties) || {})).openOn(map);
        }
      }
    } catch(e) {}
  }
  map.on('click', () => clearDesvioSelection());
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape' && event.key !== 'Esc') return;
    if (['INPUT', 'TEXTAREA', 'SELECT'].indexOf((document.activeElement || {}).tagName) >= 0) return;
    clearDesvioSelection();
  });
  grpDesviosAll.on('layerremove', (e) => {
    if (_selDvKey == null) return;
    const g = _syncBridge.dvGroups[_selDvKey];
    if (g && g.members.some(ls => layerByLS[ls] === e.layer)) clearDesvioSelection();
  });

  // Reaplica el grosor/guion adaptado al zoom a todas las capas de desvío,
  // respetando cuál está seleccionada (roja).
  function restyleAllDesvios() {
    const _zs = dvZoomStyle();
    Object.keys(layerByLS).forEach(ls => {
      const lyr = layerByLS[ls];
      if (!lyr) return;
      const _sel = _isSelectedLs(ls);
      lyr.setStyle(Object.assign({}, _zs, {
        color: _sel ? '#ff0000' : colorFor(ls),
        weight: _sel ? selWeight(_zs.weight) : _zs.weight
      }));
    });
  }

  function rebuildArrows() {
    grpFlechasAll.clearLayers();
    if (!map.hasLayer(grpDesviosAll)) return;
    // El ls seleccionado se dibuja último y con zIndexOffset alto para que su
    // flecha roja quede siempre por encima de las flechas de las demás capas.
    const keys = Object.keys(layerByLS);
    const ordered = keys.filter(ls => !_isSelectedLs(ls)).concat(keys.filter(ls => _isSelectedLs(ls)));
    ordered.forEach(ls => {
      if (!enabledLS[ls]) return;
      if (!grpDesviosAll.hasLayer(layerByLS[ls])) return;
      const sel = _isSelectedLs(ls);
      (arrowsCacheByLS[ls] || []).forEach(a => {
        const icon = makeArrowIcon(sel ? '#ff0000' : colorFor(ls), a.latlng, a.angleDeg);
        L.marker(a.latlng, { icon: icon, interactive: false, keyboard: false, zIndexOffset: sel ? 10000 : 0 }).addTo(grpFlechasAll);
      });
    });
  }

  // Inicial: mostramos desvíos + flechas
  grpDesviosAll.addTo(map);
  grpFlechasAll.addTo(map);
  rebuildArrows();
  map.on('zoomend', () => { lyrTramos.setStyle(tramosZoomStyle()); restyleAllDesvios(); rebuildArrows(); });

  // Fit bounds
  const all = [];
  boundLayers.forEach(l => {
    if (typeof l.getLayers === 'function') all.push(...l.getLayers());
    else all.push(l);
  });
  if (all.length) {
    const fg = L.featureGroup(all);
    const b = fg.getBounds();
    if (b && b.isValid()) map.fitBounds(b.pad(0.1));
  }

  // Reencuadra el mapa a las capas activas (desvíos / paradas / tramos visibles).
  function fitActiveArea() {
    try {
      const active = [];
      [grpTramos, grpDesviosAll, grpParadasAll].forEach(g => {
        if (!map.hasLayer(g)) return;
        const inner = (typeof g.getLayers === 'function') ? g.getLayers() : [g];
        inner.forEach(l => {
          if (typeof l.getLayers === 'function') active.push.apply(active, l.getLayers());
          else active.push(l);
        });
      });
      if (!active.length) return;
      const bb = L.featureGroup(active).getBounds();
      if (!bb || !bb.isValid()) return;
      // Descontar del encuadre la parte del mapa tapada por el reporte (si lo
      // solapa; cuando el reporte es un panel aparte el solape es 0).
      const mc = map.getContainer().getBoundingClientRect();
      const bp = document.getElementById('bottompanel');
      let bottom = 28;
      if (bp) {
        const rr = bp.getBoundingClientRect();
        bottom = Math.max(28, Math.min(mc.bottom - rr.top + 12, mc.height * 0.72));
      }
      map.fitBounds(bb, { paddingTopLeft: [28, 28], paddingBottomRight: [28, bottom] });
    } catch(e) {}
  }

  // Encuadra `b` de modo que la geometría llene la ventana visible del mapa
  // (descontando lo que tapa el reporte) y recuerda el encuadre para poder
  // reaplicarlo cuando el reporte se maximiza / minimiza.
  function _fitFocus(b) {
    if (!b || !b.isValid()) return;
    let bb = L.latLngBounds(b.getSouthWest(), b.getNorthEast());
    try {
      if (lyrTramos && lyrTramos.getBounds) {
        const tb = lyrTramos.getBounds();
        if (tb && tb.isValid()) bb.extend(tb);
      }
    } catch(e) {}
    _focusBounds = bb;
    try {
      const mc = map.getContainer().getBoundingClientRect();
      const bp = document.getElementById('bottompanel');
      let bottom = 16;
      if (bp && !bp.classList.contains('collapsed')) {
        const rr = bp.getBoundingClientRect();
        bottom = Math.max(16, Math.min(mc.bottom - rr.top + 12, mc.height * 0.72));
      }
      map.fitBounds(bb.pad(0.08), { paddingTopLeft: [44, 16], paddingBottomRight: [16, bottom] });
    } catch(e) {
      map.fitBounds(bb.pad(0.1));
    }
  }

  // Bounds del grupo de desvío con mayor extensión (para el botón "Todos").
  function _largestDvBounds() {
    let best = null, bestArea = -1;
    const groups = _syncBridge.dvGroups || {};
    Object.keys(groups).forEach(k => {
      const g = groups[k];
      const lyrs = ((g && g.members) || []).map(ls => layerByLS[ls]).filter(Boolean);
      if (!lyrs.length) return;
      let b;
      try { b = L.featureGroup(lyrs).getBounds(); } catch(e) { return; }
      if (!b || !b.isValid()) return;
      const dx = b.getEast() - b.getWest(), dy = b.getNorth() - b.getSouth();
      const area = Math.abs(dx * dy);
      if (area > bestArea) { bestArea = area; best = b; }
    });
    return best;
  }

  // UI helpers
  function addToggleRow(container, label, initial, onChange) {
    const id = 'id_' + label.replace(/\W+/g,'_') + '_' + Math.random().toString(16).slice(2);
    const row = document.createElement('div');
    row.style.display = 'flex';
    row.style.alignItems = 'center';
    row.style.gap = '8px';
    row.style.margin = '6px 0';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = id;
    cb.checked = initial;
    const lab = document.createElement('label');
    lab.htmlFor = id;
    lab.textContent = label;
    lab.style.cursor = 'pointer';
    cb.onchange = () => onChange(cb.checked);
    row.appendChild(cb);
    row.appendChild(lab);
    container.appendChild(row);
    return cb;
  }

  // Base map selector (al final)
  (function() {
    const base = document.getElementById('basemap');
    function addRadio(label, layer, checked) {
      const id = 'rb_' + label.replace(/\W+/g,'_');
      const row = document.createElement('div');
      row.style.display='flex'; row.style.alignItems='center'; row.style.gap='8px'; row.style.margin='6px 0';
      const rb = document.createElement('input');
      rb.type='radio'; rb.name='basemap'; rb.id=id; rb.checked=checked;
      const lab = document.createElement('label'); lab.htmlFor=id; lab.textContent=label; lab.style.cursor='pointer';
      rb.onchange = () => {
        if (!rb.checked) return;
        if (map.hasLayer(baseGoogle)) map.removeLayer(baseGoogle);
        if (map.hasLayer(baseOSM)) map.removeLayer(baseOSM);
        if (map.hasLayer(baseOSMLight)) map.removeLayer(baseOSMLight);
        layer.addTo(map);
      };
      row.appendChild(rb); row.appendChild(lab); base.appendChild(row);
    }
    addRadio('OSM claro (sentidos y nombres)', baseOSMLight, false);
    addRadio('Google Maps', baseGoogle, true);
    addRadio('OpenStreetMap', baseOSM, false);
  })();

  // Panel de capas: jerárquico
  (function() {
    const checklist = document.getElementById('checklist');
    if (!checklist) return;

    // Grupo Tramos
    const gTr = document.createElement('div');
    gTr.className='group';
    gTr.innerHTML = '<div class="group-title">Tramos afectados</div><div class="group-children"></div>';
    const trChildren = gTr.querySelector('.group-children');
    checklist.appendChild(gTr);
    addToggleRow(trChildren, 'Tramos afectados', true, (on) => {
      if (on) map.addLayer(grpTramos); else map.removeLayer(grpTramos);
    });
    gTr.querySelector('.group-title').onclick = () => gTr.classList.toggle('collapsed');

    // Grupo Desvíos
    const gDv = document.createElement('div');
    gDv.className='group';
    gDv.innerHTML = '<div class="group-title">Desvíos de colectivo</div><div class="group-children"></div>';
    const dvChildren = gDv.querySelector('.group-children');
    checklist.appendChild(gDv);

    const childCbs = _syncBridge.dvGroupCbs;

    // Master real: prende/apaga todos los hijos
    const cbAll = addToggleRow(dvChildren, 'Todos', true, (on) => {
      cbAll.indeterminate = false;
      Object.keys(layerByLS).forEach(ls => {
        enabledLS[ls] = on;
        if (on) grpDesviosAll.addLayer(layerByLS[ls]);
        else grpDesviosAll.removeLayer(layerByLS[ls]);
      });

    const syncMaster = () => {

  // Filtro por número de línea del panel de capas (igual que en la app): deja
  // las filas con alguna línea cuyo número contenga lo escrito, sin contar los
  // ceros a la izquierda ("1" encuentra 001, 010, 112…). Con letras busca en el
  // texto. Sólo oculta filas del panel; "Todos" y Tramos afectados quedan siempre.
  (function() {
    const input = document.getElementById('lineFilter');
    if (!input) return;
    function lineNumbers(text) {
      const out = [], re = /(?:^|;)\s*(\d+)/g;
      let m;
      while ((m = re.exec(String(text || ''))) !== null) out.push(m[1]);
      return out;
    }
    function matches(text, q) {
      if (!/^\d+$/.test(q)) return String(text || '').toLowerCase().indexOf(q.toLowerCase()) >= 0;
      const qs = q.replace(/^0+/, '') || '0';
      return lineNumbers(text).some(n => (n.replace(/^0+/, '') || '0').indexOf(qs) >= 0);
    }
    input.addEventListener('input', () => {
      const q = input.value.trim();
      document.querySelectorAll('#checklist .group').forEach(g => {
        const children = g.querySelector('.group-children');
        let shown = 0, filtrables = 0;
        children.querySelectorAll('label.sel-label').forEach(lab => {
          const row = lab.parentNode;
          if (row.classList.contains('modo-oculto')) return;
          filtrables++;
          const ok = !q || matches(lab.textContent, q);
          row.classList.toggle('filtro-oculto', !ok);
          if (ok) shown++;
        });
        let note = children.querySelector('.sin-coincidencias');
        if (q && filtrables && !shown) {
          if (!note) { note = document.createElement('div'); note.className = 'sin-coincidencias'; children.appendChild(note); }
          note.textContent = 'Sin líneas que coincidan con "' + q + '"';
        } else if (note) note.remove();
        if (q && shown) g.classList.remove('collapsed');
      });
    });
  })();

 // ✅ Toggles por Ruta (reporte) con retrofuncionalidad:
 // - Si TODO está prendido, al tocar una Ruta se apagan todas y quedan solo las seleccionadas.
 function setLS(ls, on){
   enabledLS[ls] = !!on;
   if (!layerByLS[ls]) return;
   if (on) grpDesviosAll.addLayer(layerByLS[ls]);
   else grpDesviosAll.removeLayer(layerByLS[ls]);
 }
 function ensureGroups(){
   const anyOn = Object.values(enabledLS).some(v => v);
   if (anyOn){
     if (!map.hasLayer(grpDesviosAll)) map.addLayer(grpDesviosAll);
     if (!map.hasLayer(grpFlechasAll)) map.addLayer(grpFlechasAll);
   } else {
     if (map.hasLayer(grpDesviosAll)) map.removeLayer(grpDesviosAll);
     if (map.hasLayer(grpFlechasAll)) map.removeLayer(grpFlechasAll);
   }
 }
 function applySelectionFromReport(){
   // unión de keys de todas las rutas tildadas

     if (!cb.checked) return;

     keys.forEach(k => selected.add(k));
   });
   // apagar todas, prender solo seleccionadas

   ensureGroups();

 }
 (function(){

   // ✅ Master checkbox en el Reporte (a la izquierda de "Líneas Afectadas"): activa/desactiva todos los items
   const cbAllReport = document.getElementById('cbReportAll');

 const paradaKeyByLabelSet = {};

    function reportToPlainText(root){

      var lines=[];
      root.querySelectorAll('h3,h4,li,p').forEach(function(el){
        var text=(el.textContent||'').replace(/\s+/g,' ').trim();

    }

    }
    document.getElementById('btnCopyReport').onclick = async () => {
      const txt = reportToPlainText(document.getElementById('reporte-html'));
      try {
        await navigator.clipboard.writeText(txt);
      } catch(e) {
        try {
          const ta=document.createElement('textarea');
          ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); ta.remove();
        } catch(_) { alert('No se pudo copiar el reporte'); }
      }
      flashBtnCopied();
    };
  })();

  // ---- Sincronización desvíos <-> paradas <-> reporte (paridad con la app) ----
  // Estado compartido por "clave afectada" (linea|recorrido|sentido). Cada
  // superficie (panel de desvíos, panel de paradas, checkboxes del reporte)
  // vuelca su estado a keyState y luego se re-aplica a las otras tres.
  (function() {
    const bridge = _syncBridge;
    const keyState = {};

    function lsAll() { return Object.keys(layerByLS); }
    function isActive(keys) { return keys.length > 0 && keys.some(k => keyState[k] !== false); }

    function setLSLocal(ls, on) {
      enabledLS[ls] = !!on;
      if (!layerByLS[ls]) return;
      if (on) grpDesviosAll.addLayer(layerByLS[ls]);
      else grpDesviosAll.removeLayer(layerByLS[ls]);
    }
    function ensureDesviosGroups() {
      const anyOn = Object.values(enabledLS).some(v => v);
      if (anyOn) {
        if (!map.hasLayer(grpDesviosAll)) map.addLayer(grpDesviosAll);
        if (!map.hasLayer(grpFlechasAll)) map.addLayer(grpFlechasAll);
      } else {
        if (map.hasLayer(grpDesviosAll)) map.removeLayer(grpDesviosAll);
        if (map.hasLayer(grpFlechasAll)) map.removeLayer(grpFlechasAll);
      }
    }
    function setParadaLocal(mk, on) {
      enabledPa[mk] = !!on;
      if (!paradasByKey[mk]) return;
      if (on) grpParadasAll.addLayer(paradasByKey[mk].holder);
      else grpParadasAll.removeLayer(paradasByKey[mk].holder);
    }
    function ensureParadasGroup() {
      const anyOn = Object.values(enabledPa).some(v => v);
      if (anyOn) { if (!map.hasLayer(grpParadasAll)) map.addLayer(grpParadasAll); }
      else if (map.hasLayer(grpParadasAll)) map.removeLayer(grpParadasAll);
    }

    const paradaKeyByLabelSet = {};
    Object.keys(paradasByKey).forEach(mk => {
      paradaKeyByLabelSet[(paradasByKey[mk].rawLabels || []).slice().sort().join('||')] = mk;
    });
    function toggleToMergeKey(cb) {
      const raw = String(cb.getAttribute('data-parada-key') || '').split('||').map(x => x.trim()).filter(Boolean);
      return paradaKeyByLabelSet[raw.slice().sort().join('||')];
    }
    function rutaToggleKeys(cb) {
      let ks = [];
      try { ks = JSON.parse(cb.getAttribute('data-keys') || '[]'); } catch(e) { ks = []; }
      const out = [];
      ks.forEach(ls => _partAffKeys(ls).forEach(k => out.push(k)));
      return out;
    }

    // PULL: superficie -> keyState
    function pullDesvios() { lsAll().forEach(ls => _lsAffKeys(ls).forEach(k => keyState[k] = !!enabledLS[ls])); }
    function pullParadas() { Object.keys(paradasByKey).forEach(mk => (paradasByKey[mk].affKeys || []).forEach(k => keyState[k] = !!enabledPa[mk])); }
    function pullReportRoutes() {
      document.querySelectorAll('#reporte-html .ruta-toggle').forEach(cb => {
        rutaToggleKeys(cb).forEach(k => keyState[k] = !!cb.checked);
      });
    }
    function pullOperativas() { (bridge.opRows || []).forEach(r => r.affKeys.forEach(k => keyState[k] = !!r.cb.checked)); }
    function applyOperativas() {
      (bridge.opRows || []).forEach(r => {
        if (!r.affKeys.length) return;
        const desired = isActive(r.affKeys);
        if (!!r.cb.checked !== desired) bridge.opPoner(r, desired);
      });
      if (bridge.opSync) bridge.opSync();
    }
    function pullReportStops() {
      document.querySelectorAll('#reporte-html .parada-toggle').forEach(cb => {
        const mk = toggleToMergeKey(cb);
        if (mk && paradasByKey[mk]) (paradasByKey[mk].affKeys || []).forEach(k => keyState[k] = !!cb.checked);
      });
    }

    // APPLY: keyState -> superficie
    function applyDesvios() {
      lsAll().forEach(ls => {
        const desired = isActive(_lsAffKeys(ls));
        if (!!enabledLS[ls] !== desired) setLSLocal(ls, desired);
      });
      ensureDesviosGroups();
      Object.keys(bridge.dvGroups).forEach(gk => {
        const g = bridge.dvGroups[gk], cb = bridge.dvGroupCbs[gk];
        if (!cb) return;
        const states = g.members.map(ls => !!enabledLS[ls]);
        const allOn = states.length > 0 && states.every(Boolean), anyOn = states.some(Boolean);
        cb.checked = allOn;
        cb.indeterminate = anyOn && !allOn;
      });
      if (bridge.dvMaster) {
        const vals = Object.values(enabledLS);
        const allOn = vals.length > 0 && vals.every(Boolean), anyOn = vals.some(Boolean);
        bridge.dvMaster.checked = allOn;
        bridge.dvMaster.indeterminate = anyOn && !allOn;
      }
      rebuildArrows();
    }
    function applyParadas() {
      Object.keys(paradasByKey).forEach(mk => {
        const desired = isActive(paradasByKey[mk].affKeys || []);
        if (!!enabledPa[mk] !== desired) setParadaLocal(mk, desired);
        const cb = bridge.paGroupCbs[mk];
        if (cb) cb.checked = !!enabledPa[mk];
      });
      ensureParadasGroup();
      if (bridge.paMaster) {
        const vals = Object.values(enabledPa);
        const allOn = vals.length > 0 && vals.every(Boolean), anyOn = vals.some(Boolean);
        bridge.paMaster.checked = allOn;
        bridge.paMaster.indeterminate = anyOn && !allOn;
      }
    }
    function applyReport() {
      const rutas = Array.prototype.slice.call(document.querySelectorAll('#reporte-html .ruta-toggle'));
      rutas.forEach(cb => {
        const keys = rutaToggleKeys(cb);
        if (keys.length) cb.checked = isActive(keys);
      });
      const cbAllR = document.getElementById('cbReportAll');
      if (cbAllR) cbAllR.checked = rutas.length > 0 && rutas.every(x => x.checked);
      const paradas = Array.prototype.slice.call(document.querySelectorAll('#reporte-html .parada-toggle'));
      paradas.forEach(cb => {
        const mk = toggleToMergeKey(cb);
        const keys = (mk && paradasByKey[mk] && paradasByKey[mk].affKeys) || [];
        if (keys.length) cb.checked = isActive(keys);
      });
      const cbAllS = document.getElementById('cbReportStopsAll');
      if (cbAllS) cbAllS.checked = paradas.length > 0 && paradas.every(x => x.checked);
    }

    let busy = false;
    function refresh(source) {
      if (busy) return;
      busy = true;
      try {
        if (source === 'desvios') pullDesvios();
        else if (source === 'paradas') pullParadas();
        else if (source === 'report-routes') pullReportRoutes();
        else if (source === 'report-stops') pullReportStops();
        else if (source === 'operativas') pullOperativas();
        else pullDesvios();
        applyDesvios();
        applyParadas();
        applyReport();
        applyOperativas();
      } finally {
        busy = false;
      }
    }
    bridge.refresh = refresh;

    const rep = document.getElementById('reporte-html');
    if (rep && !rep._syncBound) {
      rep._syncBound = true;
      rep.addEventListener('change', (ev) => {
        if (ev.target.matches('.ruta-toggle, #cbReportAll')) refresh('report-routes');
        else if (ev.target.matches('.parada-toggle, #cbReportStopsAll')) refresh('report-stops');
      });
    }

    // Estado inicial coherente entre las tres superficies.
    pullDesvios();
    applyParadas();
    applyReport();
    applyOperativas();
  })();

  // ---- Modo de listado, en el panel y en el detalle del reporte (igual que
  //      la app): "Por desvío" agrupa por recorrido de desvío en común (el de
  //      siempre); "Por línea" muestra una fila por línea - ramales - sentido
  //      ("008 - B/C - VUELTA"), ordenadas por número de línea. Acá cada fila
  //      prende o apaga las capas de esa línea (las hay por ramal). ----
  (function() {
    const KEY = 'desvios.modoListado';
    let modo = 'ruta';
    try { if (localStorage.getItem(KEY) === 'linea') modo = 'linea'; } catch(e) {}
    const partes = s => String(s || '').split(';').map(x => x.trim()).filter(Boolean);
    const primerNumero = s => { const m = String(s || '').match(/\d+/); return m ? +m[0] : Infinity; };
    const orden = (a, b) => (primerNumero(a) - primerNumero(b)) || String(a).localeCompare(String(b), 'es', { numeric: true });
    const claves = _partAffKeys;
    const comparten = (a, b) => { const s = {}; a.forEach(k => s[k] = true); return b.some(k => s[k]); };

    // Panel: filas por línea dentro del grupo "Desvíos de colectivo".
    const dvChildren = _syncBridge.dvMaster && _syncBridge.dvMaster.closest('.group-children');
    const filas = [];
    let vista = null;
    if (dvChildren) {
      vista = document.createElement('div');
      vista.className = 'vista-lineas';
      Object.keys(_syncBridge.dvGroups).forEach(gid => {
        const g = _syncBridge.dvGroups[gid];
        partes(g.label).forEach(parte => {
          const ks = claves(parte), members = g.members.filter(ls => comparten(_lsAffKeys(ls), ks));
          filas.push({ gid, parte, members: members.length ? members : g.members.slice() });
        });
      });
      filas.sort((a, b) => orden(a.parte, b.parte));
      filas.forEach(f => {
        f.cb = addToggleRow(vista, f.parte, true, (on) => {
          // Igual que la casilla de un grupo, sólo con las capas de esta línea.
          f.members.forEach(ls => {
            enabledLS[ls] = on;
            if (on) grpDesviosAll.addLayer(layerByLS[ls]);
            else grpDesviosAll.removeLayer(layerByLS[ls]);
          });
          const anyOn = Object.values(enabledLS).some(v => v);
          [grpDesviosAll, grpFlechasAll].forEach(g => {
            if (anyOn && !map.hasLayer(g)) map.addLayer(g);
            else if (!anyOn && map.hasLayer(g)) map.removeLayer(g);
          });
          rebuildArrows();
          _syncBridge.refresh('desvios');
        });
        f.lab = f.cb.parentNode.querySelector('label');
        f.lab.removeAttribute('for');
        f.lab.className = 'sel-label';
        f.lab.title = 'Resaltar el desvío de esta línea y sus paradas asociadas';
        f.lab.onclick = (e) => { e.preventDefault(); selectDesvioGroup(f.gid); };
      });
    }
    function syncFilas() {
      filas.forEach(f => {
        const on = f.members.filter(ls => enabledLS[ls]).length;
        f.cb.checked = on === f.members.length;
        f.cb.indeterminate = on > 0 && on < f.members.length;
      });
    }
    function marcarSeleccion() {
      filas.forEach(f => f.lab.classList.toggle('is-selected', _selDvKey != null && f.gid === _selDvKey));
    }
    const selectDesvioGroupBase = selectDesvioGroup;
    selectDesvioGroup = function(key, abrirTarjeta) { selectDesvioGroupBase(key, abrirTarjeta); marcarSeleccion(); };
    // Último en escuchar: cualquier cambio de capas (panel, reporte, paradas) ya se aplicó.
    document.addEventListener('change', syncFilas);

    // Reporte: la lista del detalle (las filas con .ruta-toggle) se abre en una fila por línea.
    function aplicarAlReporte() {
      document.querySelectorAll('#reporte-html ul').forEach(ul => {
        if (!ul._originales) {
          if (!ul.querySelector(':scope > li > input.ruta-toggle')) return;
          ul._originales = Array.from(ul.children);
        }
        if (modo === 'linea' && !ul._porLinea) {
          const nuevas = [];
          ul._originales.forEach(li => {
            const cb = li.querySelector(':scope > input.ruta-toggle'), b = li.querySelector(':scope > b');
            if (!cb || !b) { nuevas.push({ li, parte: '' }); return; }
            let keys = [];
            try { keys = JSON.parse(cb.getAttribute('data-keys') || '[]'); } catch(e) { keys = []; }
            partes(b.textContent).forEach(parte => {
              const ks = claves(parte), propias = keys.filter(k => comparten(claves(k), ks)), copia = li.cloneNode(true);
              copia.querySelector(':scope > b').textContent = parte;
              copia.querySelector(':scope > input.ruta-toggle').setAttribute('data-keys', JSON.stringify(propias.length ? propias : keys));
              nuevas.push({ li: copia, parte });
            });
          });
          nuevas.sort((a, b) => orden(a.parte, b.parte));
          ul._porLinea = nuevas.map(x => x.li);
        }
        while (ul.firstChild) ul.removeChild(ul.firstChild);
        (modo === 'linea' ? ul._porLinea : ul._originales).forEach(li => ul.appendChild(li));
      });
    }

    const controles = Array.from(document.querySelectorAll('.modo-listado'));
    controles.forEach(el => {
      el.innerHTML = '<button type="button" data-modo="ruta" title="Agrupado por recorrido de desvío en común">Por desvío</button>'
        + '<button type="button" data-modo="linea" title="Una fila por línea, ramales y sentido">Por línea</button>';
      el.querySelectorAll('button').forEach(b => b.onclick = (e) => { e.stopPropagation(); aplicar(b.getAttribute('data-modo')); });
    });
    function aplicar(nuevo) {
      modo = nuevo === 'linea' ? 'linea' : 'ruta';
      try { localStorage.setItem(KEY, modo); } catch(e) {}
      controles.forEach(el => el.querySelectorAll('button').forEach(b => b.classList.toggle('activo', b.getAttribute('data-modo') === modo)));
      if (dvChildren) {
        Object.keys(_syncBridge.dvGroupCbs).forEach(gk => {
          const row = _syncBridge.dvGroupCbs[gk].closest('div');
          if (row) row.classList.toggle('modo-oculto', modo === 'linea');
        });
        if (modo === 'linea') dvChildren.appendChild(vista); else if (vista.parentNode) vista.remove();
      }
      aplicarAlReporte();
      // Las filas nuevas toman el estado de las capas.
      _syncBridge.refresh('desvios');
      syncFilas();
      marcarSeleccion();
      const filtro = document.getElementById('lineFilter');
      if (filtro) filtro.dispatchEvent(new Event('input'));
    }
    aplicar(modo);
  })();

  // Ocultar/mostrar reporte
  const bottomPanel = document.getElementById('bottompanel');
  const btnToggle = document.getElementById('toggleReport');
  const dragbar = document.getElementById('dragbar');
  btnToggle.onclick = () => {
    const collapsed = bottomPanel.classList.toggle('collapsed');
    btnToggle.textContent = collapsed ? 'Mostrar reporte' : 'Ocultar reporte';
    dragbar.style.display = collapsed ? 'none' : 'block';
    // Esperar a que termine la transición de altura del panel antes de
    // recalcular el tamaño del mapa y reencuadrar al área activa.
    setTimeout(() => {
      map.invalidateSize();
      requestAnimationFrame(() => {
        map.invalidateSize();
        if (_focusBounds && _focusBounds.isValid()) _fitFocus(_focusBounds);
        else fitActiveArea();
      });
    }, 320);
  };

  map.whenReady(() => setTimeout(() => map.invalidateSize(true), 350));
  window.addEventListener('resize', () => setTimeout(() => map.invalidateSize(), 250));
 window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(true), 400));
  </script>
</body>
